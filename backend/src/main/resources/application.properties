spring.application.name=campus-secondhand

# ==================== Thymeleaf ====================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ==================== 数据源 ====================
# ⚠️ 这里**必须用 [::1] 而不是 localhost**，原因见下方说明。
#
# 本机同时跑着两个 MySQL：
#   · MySQL80   8.0.41  → 监听 IPv6  ::1:3306   ← 本项目要连的是它
#   · wampmysqld 5.5.24 → 监听 IPv4  127.0.0.1:3306
# 写 localhost 时解析到 IPv4，会连到 WAMP 的 5.5.24；
# 而 5.5 不支持 datetime(6) 与 DATETIME 默认值，启动会直接报
#   "Invalid default value for 'create_time'" / DDL 语法错误。
# 用 [::1] 精确指向 8.0.41，不需要动 WAMP。
#
# 连接信息均可用环境变量覆盖：DB_URL / DB_USERNAME / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://[::1]:3306/login_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update 由 Hibernate 负责新增列/表；
# 索引、回填、数据修复由 DatabaseUpgrader 幂等完成。
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 开发期保留 SQL 打印便于核对状态机写入；生产建议关闭
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# ==================== 上传 ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=uploads

# ==================== 服务端口 ====================
server.port=8081

# ==================== JSON ====================
# Spring Boot 4 使用 Jackson 3（tools.jackson），旧版 spring.jackson.serialization.*
# 的 WRITE_DATES_AS_TIMESTAMPS 已不存在，改为日期格式配置。
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.default-property-inclusion=non_null

# ==================== Agent 集成 ====================
# Python agent 服务调用 /api/v1/** 时必须携带的服务令牌。
# 生产环境请用环境变量 AGENT_SERVICE_TOKEN 覆盖，不要提交真实密钥。
app.agent.service-token=${AGENT_SERVICE_TOKEN:demo-agent-token-local}
# capability token 有效期（分钟）
app.agent.token-ttl-minutes=30
app.agent.session-ttl-minutes=30
# Python agent 服务地址（前端 AI 助手抽屉调用的地址）
app.agent.public-url=${AGENT_PUBLIC_URL:http://127.0.0.1:8090}

# ==================== 日志 ====================
logging.level.campus.secondhand=INFO
# 排查状态机问题时打开
# logging.level.campus.secondhand.service=DEBUG
