<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-container {
            background: #fff;
            border-radius: 16px;
            padding: 40px 30px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #07c160;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            color: #fff;
            margin: 0 auto 16px;
            animation: scaleIn 0.6s ease 0.3s both;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }

        .success-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .success-sub {
            font-size: 14px;
            color: #999;
            margin-bottom: 20px;
        }

        .amount-box {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
        }

        .amount-box .label {
            font-size: 13px;
            color: #999;
        }

        .amount-box .number {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }

        .order-info {
            font-size: 13px;
            color: #999;
            margin-bottom: 24px;
        }

        .order-info span {
            color: #333;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            flex: 1;
            height: 44px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            flex: 1;
            height: 44px;
            border: 1px solid #ddd;
            border-radius: 22px;
            background: #fff;
            color: #666;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: #07c160;
            color: #07c160;
        }

        .confetti {
            position: fixed;
            top: -10px;
            font-size: 24px;
            animation: confettiFall linear forwards;
            pointer-events: none;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="success-container">
    <div class="success-icon">✓</div>
    <div class="success-title">支付成功</div>
    <div class="success-sub">您的订单已支付成功，请等待卖家确认</div>

    <div class="amount-box">
        <div class="label">支付金额</div>
        <div class="number">¥<span th:text="${order.price}"></span></div>
    </div>

    <div class="order-info">
        订单号：<span th:text="${order.orderNo}" style="font-size:12px;"></span>
        <br>
        支付时间：<span th:text="${#temporals.format(order.payTime, 'yyyy-MM-dd HH:mm:ss')}"></span>
    </div>

    <div class="btn-group">
        <!-- 三个出口都要有：看这一单、看全部订单、回首页继续逛。
             原来只有前两个，用户支付完想回首页只能手动改地址。 -->
        <a th:href="@{/order/detail(orderNo=${order.orderNo})}" class="btn-secondary">查看这一单</a>
        <a th:href="@{/order/list}" class="btn-secondary">全部订单</a>
        <a th:href="@{/home}" class="btn-primary">返回首页</a>
    </div>
</div>

<script>
    // 🎉 彩色纸屑特效
    function launchConfetti() {
        const emojis = ['🎉', '🎊', '✨', '⭐', '🎈', '🎁', '💫', '🌟'];
        const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#a29bfe', '#fd79a8'];

        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'confetti';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (16 + Math.random() * 20) + 'px';
                el.style.animationDuration = (2 + Math.random() * 3) + 's';
                el.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(el);

                setTimeout(() => el.remove(), 5000);
            }, i * 60);
        }
    }

    // 页面加载后触发彩屑
    window.addEventListener('load', launchConfetti);
</script>

</body>
</html>
