<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信支付</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        .pay-container {
            background: #fff;
            border-radius: 16px;
            padding: 30px 24px 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }

        .wechat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .wechat-icon {
            width: 44px;
            height: 44px;
            background: #07c160;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
        }

        .wechat-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .wechat-sub {
            font-size: 13px;
            color: #999;
        }

        .amount-box {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
        }

        .amount-label {
            font-size: 13px;
            color: #999;
        }

        .amount-number {
            font-size: 36px;
            font-weight: bold;
            color: #333;
            margin-top: 4px;
        }

        .amount-number .symbol {
            font-size: 24px;
            color: #666;
        }

        .order-info {
            font-size: 13px;
            color: #999;
            text-align: center;
            margin-bottom: 20px;
        }

        .order-info span {
            color: #333;
        }

        .password-input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .password-input-group input {
            width: 44px;
            height: 50px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: 600;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        .password-input-group input:focus {
            border-color: #07c160;
            background: #fff;
        }

        .password-input-group input.filled {
            border-color: #07c160;
            background: #f0faf5;
        }

        .password-input-group input.error {
            border-color: #ff4400;
            background: #fff5f5;
        }

        .error-msg {
            color: #ff4400;
            font-size: 13px;
            text-align: center;
            margin-bottom: 12px;
            min-height: 20px;
        }

        .pay-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 24px;
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .pay-btn:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #999;
            font-size: 14px;
            text-decoration: none;
        }

        .cancel-link:hover {
            color: #666;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 10px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #e0e0e0;
            border-top-color: #07c160;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            z-index: 999;
            display: none;
            animation: fadeInDown 0.3s ease;
        }
        .toast.show {
            display: block;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
    </style>
</head>
<body>

<!-- Toast -->
<div id="toast" class="toast"></div>

<div class="pay-container">
    <!-- 微信支付 Header -->
    <div class="wechat-header">
        <div class="wechat-icon">💳</div>
        <div>
            <div class="wechat-title">微信支付</div>
            <div class="wechat-sub">安全 · 便捷</div>
        </div>
    </div>

    <!-- 金额 -->
    <div class="amount-box">
        <div class="amount-label">支付金额</div>
        <div class="amount-number">
            <span class="symbol">¥</span>
            <span th:text="${order.price}"></span>
        </div>
    </div>

    <!-- 订单信息 -->
    <div class="order-info">
        订单号：<span th:text="${order.orderNo}" style="font-size:12px;"></span>
    </div>

    <!-- ⭐ 错误信息 - 确保这个元素存在 -->
    <div class="error-msg" id="errorMsg"></div>

    <!-- 表单 -->
    <form id="payForm" action="/order/pay" method="post">
        <input type="hidden" name="orderNo" th:value="${order.orderNo}">
        <input type="hidden" name="payPassword" id="payPassword">

        <div class="password-input-group">
            <input type="password" maxlength="1" class="pwd-input" data-index="0" autofocus>
            <input type="password" maxlength="1" class="pwd-input" data-index="1">
            <input type="password" maxlength="1" class="pwd-input" data-index="2">
            <input type="password" maxlength="1" class="pwd-input" data-index="3">
            <input type="password" maxlength="1" class="pwd-input" data-index="4">
            <input type="password" maxlength="1" class="pwd-input" data-index="5">
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color:#999;font-size:13px;margin-top:8px;">支付中...</p>
        </div>

        <button class="pay-btn" type="button" id="payBtn" onclick="submitPay()">确认支付</button>
    </form>

    <a href="/order/detail?orderNo=" th:href="@{/order/detail(orderNo=${order.orderNo})}" class="cancel-link">← 返回订单详情</a>
</div>

<script>
    const inputs = document.querySelectorAll('.pwd-input');
    const payPassword = document.getElementById('payPassword');
    const payBtn = document.getElementById('payBtn');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('errorMsg');

    // ⭐ 安全检查
    console.log('=== 元素检查 ===');
    console.log('errorMsg 是否存在:', errorMsg !== null);
    console.log('payBtn 是否存在:', payBtn !== null);
    console.log('payPassword 是否存在:', payPassword !== null);

    // 自动跳转输入框
    inputs.forEach((input, index) => {
        input.addEventListener('input', function() {
            if (this.value.length === 1) {
                this.classList.add('filled');
                this.classList.remove('error');
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
                updatePassword();
                if (errorMsg) errorMsg.textContent = '';
            }
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && this.value === '') {
                if (index > 0) {
                    inputs[index - 1].focus();
                    inputs[index - 1].value = '';
                    inputs[index - 1].classList.remove('filled');
                    updatePassword();
                }
            }
        });

        input.addEventListener('focus', function() {
            if (this.value !== '') {
                this.select();
            }
        });
    });

    // 更新密码值
    function updatePassword() {
        let password = '';
        inputs.forEach(input => {
            password += input.value;
        });
        payPassword.value = password;
        console.log('当前密码:', password);
    }

    /**
     * 提交支付
     */
    function submitPay() {
        const password = payPassword.value;
        const orderNo = document.querySelector('input[name="orderNo"]').value;

        console.log('=== 点击确认支付 ===');
        console.log('orderNo:', orderNo);
        console.log('payPassword:', password);

        // 验证密码完整性
        if (password.length < 6) {
            inputs.forEach(input => {
                if (input.value === '') {
                    input.classList.add('error');
                }
            });
            // ⭐ 使用 showToast 替代 errorMsg
            showToast('⚠️ 请完整输入6位支付密码');
            return;
        }

        // 清除错误
        inputs.forEach(input => input.classList.remove('error'));
        if (errorMsg) errorMsg.textContent = '';

        // 禁用按钮
        payBtn.disabled = true;
        payBtn.textContent = '支付中...';
        loading.classList.add('show');

        // 使用 fetch 发送请求
        const formData = new URLSearchParams();
        formData.append('orderNo', orderNo);
        formData.append('payPassword', password);

        fetch('/order/pay', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: formData.toString()
        })
            .then(response => {
                console.log('响应状态:', response.status);
                // 检查是否是重定向
                if (response.redirected) {
                    console.log('重定向到:', response.url);
                    window.location.href = response.url;
                    return;
                }
                return response.text();
            })
            .then(data => {
                console.log('响应数据长度:', data ? data.length : 0);
                // 如果返回的是 HTML，可能是支付确认页（密码错误）
                if (data && data.includes('payConfirm')) {
                    // 恢复按钮
                    payBtn.disabled = false;
                    payBtn.textContent = '确认支付';
                    loading.classList.remove('show');
                    showToast('❌ 支付密码错误，请重试');
                    // 清空密码
                    inputs.forEach(input => {
                        input.value = '';
                        input.classList.remove('filled');
                    });
                    payPassword.value = '';
                    inputs[0].focus();
                }
            })
            .catch(error => {
                console.error('支付请求失败:', error);
                showToast('❌ 支付请求失败，请重试');
                payBtn.disabled = false;
                payBtn.textContent = '确认支付';
                loading.classList.remove('show');
            });
    }

    // 显示 Toast
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    // 回车键触发支付
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            const lastInput = inputs[inputs.length - 1];
            if (document.activeElement === lastInput && lastInput.value !== '') {
                submitPay();
            }
        }
    });

    console.log('=== payConfirm 页面加载完成 ===');
    console.log('订单号:', document.querySelector('input[name="orderNo"]').value);
</script>

</body>
</html>
