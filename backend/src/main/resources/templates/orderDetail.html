<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f5f5;
            padding-bottom: 100px;
        }
        header {
            background: #fff;
            height: 46px;
            line-height: 46px;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            border-bottom: 1px solid #eee;
            position: relative;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        header a {
            position: absolute;
            left: 15px;
            top: 0;
            color: #333;
            text-decoration: none;
            font-size: 20px;
        }

        /* 订单状态 */
        .status-card {
            background: #fff;
            margin: 10px;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .status-text {
            font-size: 18px;
            font-weight: 500;
            color: #333;
        }
        .status-sub {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }

        .status-unpaid .status-text {
            color: #ff4400;
        }
        .status-paid .status-text {
            color: #07c160;
        }

        /* 商品信息 */
        .goods-card {
            background: #fff;
            margin: 10px;
            border-radius: 10px;
            display: flex;
            padding: 12px;
        }
        .goods-img {
            width: 80px;
            height: 80px;
            border-radius: 6px;
            object-fit: cover;
            background: #eee;
        }
        .goods-info {
            flex: 1;
            padding-left: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .goods-title {
            font-size: 15px;
            color: #333;
        }
        .goods-price {
            color: #ff4400;
            font-size: 18px;
            font-weight: bold;
        }

        /* 订单信息 */
        .info-card {
            background: #fff;
            margin: 10px;
            border-radius: 10px;
            padding: 0 15px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            line-height: 44px;
            font-size: 14px;
            border-bottom: 1px solid #f2f2f2;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .label {
            color: #666;
        }
        .value {
            color: #333;
        }

        /* 支付按钮 */
        .pay-section {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            padding: 12px 15px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }
        .pay-amount {
            flex: 1;
            font-size: 15px;
        }
        .pay-amount .price {
            color: #ff4400;
            font-size: 22px;
            font-weight: bold;
        }
        .pay-btn {
            width: 140px;
            height: 44px;
            border-radius: 22px;
            border: none;
            background: linear-gradient(135deg, #07c160, #06ad56);
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .pay-btn:active {
            opacity: 0.8;
        }
        .pay-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .paid-status {
            color: #07c160;
            font-weight: 500;
            font-size: 16px;
        }
    </style>
</head>
<body>

<header>
    <a href="javascript:history.back()">←</a>
    订单详情
</header>

<!-- 订单状态 -->
<div class="status-card" th:classappend="${order.status == 'UNPAID' ? 'status-unpaid' : 'status-paid'}">
    <div class="status-icon" th:if="${order.status == 'UNPAID'}">⏳</div>
    <div class="status-icon" th:if="${order.status == 'PAID'}">✅</div>
    <div class="status-text" th:if="${order.status == 'UNPAID'}">待付款</div>
    <div class="status-text" th:if="${order.status == 'PAID'}">已付款</div>
    <div class="status-sub" th:if="${order.status == 'UNPAID'}">请尽快完成支付，超时订单将自动取消</div>
    <div class="status-sub" th:if="${order.status == 'PAID'}">支付成功，等待卖家发货</div>
</div>

<!-- 商品信息 -->
<div class="goods-card">
    <img class="goods-img" th:src="${product?.image}" alt="商品图片" onerror="this.src='/images/default.png'">
    <div class="goods-info">
        <div class="goods-title" th:text="${product?.name != null ? product.name : '商品已下架'}"></div>
        <div class="goods-price">¥<span th:text="${order.price}"></span></div>
    </div>
</div>

<!-- 订单信息 -->
<div class="info-card">
    <div class="info-row">
        <div class="label">订单编号</div>
        <div class="value" th:text="${order.orderNo}" style="font-size:12px;"></div>
    </div>
    <div class="info-row">
        <div class="label">创建时间</div>
        <div class="value" th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
    </div>
    <div class="info-row" th:if="${order.payTime != null}">
        <div class="label">支付时间</div>
        <div class="value" th:text="${#temporals.format(order.payTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
    </div>
    <div class="info-row">
        <div class="label">交易方式</div>
        <div class="value">面交自提</div>
    </div>
</div>

<!-- 底部支付 -->
<div class="pay-section">
    <div class="pay-amount">
        需支付：<span class="price">¥<span th:text="${order.price}"></span></span>
    </div>
    <!-- ⭐ 修改：跳转到支付确认页 -->
    <form th:if="${order.status == 'UNPAID'}" th:action="@{/order/pay}" method="post">
        <input type="hidden" name="orderNo" th:value="${order.orderNo}">
        <button class="pay-btn" type="submit">微信支付</button>
    </form>
    <div th:if="${order.status == 'PAID'}" class="paid-status">✅ 已支付</div>
</div>

</body>
</html>
