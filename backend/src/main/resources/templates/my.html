<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人中心 - 校园二手交易</title>
    <style>
        * { box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei"; }
        body { background:#f5f6f8; margin:0; }

        .back-arrow {
            position:fixed; top:20px; left:20px;
            width:44px; height:44px; background:#fff;
            border-radius:50%; display:flex;
            align-items:center; justify-content:center;
            font-size:20px; color:#667eea;
            text-decoration:none; box-shadow:0 2px 10px rgba(0,0,0,.1);
            z-index:999;
        }

        .user-header {
            background:linear-gradient(135deg,#667eea,#764ba2);
            color:#fff; padding:60px 40px 40px;
            display:flex; align-items:center; gap:30px;
        }

        .avatar {
            width:100px; height:100px;
            background:rgba(255,255,255,.2);
            border-radius:50%; font-size:48px;
            display:flex; align-items:center; justify-content:center;
        }

        .username { font-size:26px; font-weight:600; }

        .info-box {
            max-width:900px; margin:30px auto;
            background:#fff; border-radius:16px;
            padding:40px; box-shadow:0 4px 20px rgba(0,0,0,.06);
        }

        .info-title {
            font-size:20px; font-weight:600;
            margin-bottom:25px; color:#333;
        }

        .info-row {
            display:flex; align-items:center;
            padding:16px 0; border-bottom:1px solid #f0f0f0;
        }

        .info-label {
            width:120px; color:#999; font-size:15px;
        }

        .info-value {
            flex:1; font-size:16px; color:#333;
        }

        .menu {
            max-width:900px; margin:20px auto;
        }

        .menu-item {
            display:flex; justify-content:space-between;
            align-items:center; background:#fff;
            padding:18px 24px; margin-bottom:12px;
            border-radius:12px; text-decoration:none;
            color:#333; font-size:15px;
            box-shadow:0 2px 8px rgba(0,0,0,.04);
            transition:.2s;
        }

        .menu-item:hover {
            transform:translateY(-2px);
            box-shadow:0 4px 15px rgba(0,0,0,.08);
        }

        .menu-left { display:flex; align-items:center; gap:12px; }
        .menu-icon { font-size:20px; }
        .arrow { color:#ccc; font-size:18px; }

        /* 订单角标 */
        .badge {
            background:#ff4400;
            color:#fff;
            font-size:12px;
            padding:2px 10px;
            border-radius:12px;
            font-weight:500;
        }

        .mask {
            position:fixed; inset:0;
            background:rgba(0,0,0,.5);
            display:flex; align-items:center; justify-content:center;
            z-index:9999;
        }

        .mask-box { background:#fff; padding:30px; border-radius:12px; text-align:center; }
        .mask-box a { color:#667eea; font-weight:600; }
    </style>
</head>
<body>

<a href="/home" class="back-arrow">⬅️</a>

<div class="mask" th:if="${user == null}">
    <div class="mask-box">
        <h3>您还未登录</h3>
        <p>请先 <a href="/login">登录</a></p>
    </div>
</div>

<div th:if="${user != null}">

    <div class="user-header">
        <div class="avatar">👤</div>
        <div>
            <div class="username" th:text="${user.username}"></div>
            <div th:if="${user.school != null}"
                 th:text="${user.school}"
                 style="opacity:.9; font-size:14px; margin-top:6px;">
            </div>
        </div>
    </div>

    <!-- 基本信息 -->
    <div class="info-box">
        <div class="info-title">基本信息</div>

        <div class="info-row">
            <div class="info-label">用户名</div>
            <div class="info-value" th:text="${user.username}"></div>
        </div>

        <div class="info-row">
            <div class="info-label">学校</div>
            <div class="info-value"
                 th:text="${user.school != null ? user.school : '未设置'}">
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">年级</div>
            <div class="info-value"
                 th:text="${user.grade != null ? user.grade : '未设置'}">
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">手机号</div>
            <div class="info-value"
                 th:text="${user.phone != null ? user.phone : '未绑定'}">
            </div>
        </div>
    </div>

    <!-- 菜单 -->
    <div class="menu">

        <a href="/order/list" class="menu-item">
            <div class="menu-left">
                <span class="menu-icon">📋</span>
                <span>我的订单</span>
                <span class="badge" th:if="${unpaidCount != null && unpaidCount > 0}"
                      th:text="${unpaidCount}"></span>
            </div>
            <span class="arrow">›</span>
        </a>

        <a href="/address" class="menu-item">
            <div class="menu-left">
                <span class="menu-icon">📍</span>
                <span>收货地址</span>
            </div>
            <span class="arrow">›</span>
        </a>

        <!-- 「我的闲置」已并入「我的订单 → 出售」：
             原来这里和订单页看的是同一批数据，分成两个入口反而让人困惑 -->
        <a href="/favorites" class="menu-item">
            <div class="menu-left">
                <span class="menu-icon">⭐</span>
                <span>我的收藏</span>
            </div>
            <span class="arrow">›</span>
        </a>

        <a href="/my/reports" class="menu-item">
            <div class="menu-left">
                <span class="menu-icon">🚩</span>
                <span>我的举报</span>
            </div>
            <span class="arrow">›</span>
        </a>

        <!-- 原来指向 /settings，但后端没有这个路由（点了 404）。
             站内没有"改密码"页面，能改的就是资料，所以指向编辑资料。 -->
        <a href="/edit-profile" class="menu-item">
            <div class="menu-left">
                <span class="menu-icon">⚙️</span>
                <span>编辑资料</span>
            </div>
            <span class="arrow">›</span>
        </a>
    </div>

    <div style="text-align:center; margin-top:40px;">
        <a href="/logout" style="color:#ff4d4f; text-decoration:none; font-weight:600;">
            退出登录
        </a>
    </div>

</div>

</body>
</html>
