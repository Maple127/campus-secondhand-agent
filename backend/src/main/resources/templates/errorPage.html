<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>出错了 - 校园二手交易平台</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #2d3748;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 48px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
        }
        .icon { font-size: 56px; line-height: 1; margin-bottom: 16px; }
        h1 { font-size: 22px; margin: 0 0 12px; }
        p { color: #718096; font-size: 15px; line-height: 1.7; margin: 0 0 28px; }
        .actions { display: flex; gap: 12px; justify-content: center; }
        a {
            text-decoration: none;
            padding: 11px 26px;
            border-radius: 10px;
            font-size: 15px;
            transition: opacity .2s;
        }
        a:hover { opacity: .85; }
        .primary { background: #4f8cff; color: #fff; }
        .ghost { background: #edf2f7; color: #4a5568; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🛠️</div>
    <h1>操作没有完成</h1>
    <p th:text="${errorMessage} ?: '系统开小差了，请稍后重试'">系统开小差了，请稍后重试</p>
    <div class="actions">
        <a class="primary" th:href="@{/home}">返回首页</a>
        <a class="ghost" th:href="@{/my}">个人中心</a>
    </div>
</div>
</body>
</html>
