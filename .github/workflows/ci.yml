name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交进来时，取消上一次还在跑的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------
  # 后端：单元测试（不依赖数据库）
  #
  # 这些测试全部用 Mockito 打桩，没有 @SpringBootTest ——
  # 所以 CI 里不需要跑 MySQL 服务，速度更快也更稳。
  # 真正需要数据库的端到端验证由 infra/smoke-test.ps1 承担（手动执行）。
  # ---------------------------------------------------------------
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  # ---------------------------------------------------------------
  # Agent：代码风格 + 类型检查
  # ---------------------------------------------------------------
  agent-lint:
    name: Agent lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements*.txt

      - name: Install dev deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: ruff check
        working-directory: agent
        run: ruff check .

      - name: ruff format
        working-directory: agent
        run: ruff format --check .

      - name: mypy
        working-directory: agent
        run: mypy app

  # ---------------------------------------------------------------
  # Agent：单元测试
  #
  # 测试用 FakeBackend 替代真实 HTTP，不需要 Java 后端在线，
  # 也不需要 DeepSeek API key。
  # ---------------------------------------------------------------
  agent-test:
    name: Agent tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent/requirements*.txt

      - name: Install deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: agent
        run: pytest
