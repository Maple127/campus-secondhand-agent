<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 助手 · 调试台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f0f2f5; color: #1f2937; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #fff; padding: 12px 20px; border-bottom: 1px solid #e5e7eb;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: #eef2ff; color: #4f46e5; }
  .spacer { flex: 1; }
  input, button, select {
    font-family: inherit; font-size: 13px; padding: 7px 11px;
    border: 1px solid #d1d5db; border-radius: 8px; outline: none;
  }
  input:focus { border-color: #4f8cff; box-shadow: 0 0 0 3px rgba(79,140,255,.15); }
  button { cursor: pointer; background: #4f8cff; color: #fff; border: none; font-weight: 500; }
  button:hover { background: #3b7aef; }
  button.ghost { background: #fff; color: #4a5568; border: 1px solid #d1d5db; }
  button.ghost:hover { background: #f9fafb; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 10px; max-width: 860px; width: 100%; }
  .row.user { align-self: flex-end; flex-direction: row-reverse; }
  .bubble {
    padding: 11px 15px; border-radius: 14px; line-height: 1.65; font-size: 14px;
    white-space: pre-wrap; word-break: break-word; max-width: 76%;
  }
  .user .bubble { background: #4f8cff; color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .sys { align-self: center; font-size: 12px; color: #6b7280; background: #e5e7eb;
         padding: 4px 12px; border-radius: 99px; }
  .tool {
    align-self: flex-start; font-size: 12.5px; font-family: ui-monospace, Consolas, monospace;
    background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 9px;
    padding: 8px 12px; color: #475569; max-width: 88%;
  }
  .tool b { color: #0f766e; }
  .tool pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-all; color: #64748b; max-height: 180px; overflow: auto; }
  .err { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
  footer { background: #fff; border-top: 1px solid #e5e7eb; padding: 12px 20px; }
  .composer { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
  .composer input { flex: 1; }
  .chips { max-width: 900px; margin: 0 auto 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { font-size: 12px; padding: 5px 11px; border-radius: 99px; background: #f1f5f9;
          border: 1px solid #e2e8f0; color: #475569; cursor: pointer; }
  .chip:hover { background: #e2e8f0; }
</style>
</head>
<body>
<header>
  <h1>🛒 校园二手 · AI 助手调试台</h1>
  <span class="badge" id="status">未连接</span>
  <div class="spacer"></div>
  <input id="backendUrl" value="http://localhost:8081" style="width:180px" title="Java 后端地址">
  <input id="username" value="user01" style="width:100px" title="登录用户名">
  <input id="password" type="password" value="pass123" style="width:100px" title="密码">
  <button id="connectBtn">登录并获取令牌</button>
  <button class="ghost" id="clearBtn">清空</button>
</header>

<div id="log">
  <div class="sys">先点「登录并获取令牌」，再开始对话</div>
</div>

<footer>
  <div class="chips">
    <span class="chip">有没有便宜点的 iPad？</span>
    <span class="chip">500 以内的数码产品</span>
    <span class="chip">高等数学那本书多少钱合适？</span>
    <span class="chip">我发布的闲置卖出去没</span>
    <span class="chip">看看我的订单</span>
  </div>
  <div class="composer">
    <input id="msg" placeholder="用一句话告诉我你要做什么…" autocomplete="off">
    <button id="sendBtn">发送</button>
  </div>
</footer>

<script>
const AGENT_URL = location.origin;
let actorToken = null;
let conversationId = 'conv-' + Math.random().toString(36).slice(2, 10);

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const msgEl = document.getElementById('msg');

function addRow(cls, text) {
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  row.appendChild(bubble);
  logEl.appendChild(row);
  logEl.scrollTop = logEl.scrollHeight;
  return bubble;
}
function addSys(text) {
  const d = document.createElement('div');
  d.className = 'sys';
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
function addTool(name, args) {
  const d = document.createElement('div');
  d.className = 'row assistant';
  const box = document.createElement('div');
  box.className = 'tool';
  box.innerHTML = '🔧 <b>' + name + '</b>' + (args ? '<pre>' + JSON.stringify(args) + '</pre>' : '');
  d.appendChild(box);
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  return box;
}

document.getElementById('connectBtn').onclick = async () => {
  const backend = document.getElementById('backendUrl').value.replace(/\/$/, '');
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  statusEl.textContent = '登录中…';
  try {
    // 1) 登录 Java 后端，拿到 session cookie
    await fetch(backend + '/doLogin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username, password }),
      credentials: 'include',
    });
    // 2) 用 session 换取 capability token
    const r = await fetch(backend + '/api/v1/agent/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Service-Token': 'demo-agent-token-local' },
      body: JSON.stringify({ conversationId }),
      credentials: 'include',
    });
    const data = await r.json();
    if (data.code !== 0) throw new Error(data.message || '获取令牌失败');
    actorToken = data.data.actorToken;
    conversationId = data.data.conversationId;
    statusEl.textContent = '已连接 · ' + data.data.user.username;
    statusEl.style.background = '#dcfce7';
    statusEl.style.color = '#15803d';
    addSys('已获取能力令牌，范围：' + data.data.scopes.length + ' 项');
  } catch (e) {
    statusEl.textContent = '连接失败';
    statusEl.style.background = '#fee2e2';
    statusEl.style.color = '#b91c1c';
    addSys('连接失败：' + e.message + '（请确认后端已启动、账号密码正确）');
  }
};

document.getElementById('clearBtn').onclick = () => {
  conversationId = 'conv-' + Math.random().toString(36).slice(2, 10);
  logEl.innerHTML = '';
  addSys('已开启新会话 ' + conversationId);
};

async function send() {
  const text = msgEl.value.trim();
  if (!text) return;
  if (!actorToken) { addSys('请先点「登录并获取令牌」'); return; }

  msgEl.value = '';
  addRow('user', text);
  const bubble = addRow('assistant', '');

  const sendBtn = document.getElementById('sendBtn');
  sendBtn.disabled = true;

  try {
    const resp = await fetch(AGENT_URL + '/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Actor-Token': actorToken },
      body: JSON.stringify({ message: text, conversationId }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.detail || ('HTTP ' + resp.status));
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 以空行分隔事件
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let evt;
        try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }

        if (evt.type === 'token') {
          bubble.textContent += evt.text;
          logEl.scrollTop = logEl.scrollHeight;
        } else if (evt.type === 'tool_start') {
          addTool(evt.name, evt.args);
        } else if (evt.type === 'tool_end') {
          const box = addTool(evt.name + (evt.ok ? ' ✓' : ' ✗') + ' 返回', null);
          const pre = document.createElement('pre');
          pre.textContent = evt.preview || '';
          box.appendChild(pre);
        } else if (evt.type === 'error') {
          bubble.textContent = '⚠️ ' + evt.message;
          bubble.parentElement.querySelector('.bubble').style.background = '#fef2f2';
        }
      }
    }
    if (!bubble.textContent) bubble.textContent = '（没有返回内容）';
  } catch (e) {
    bubble.textContent = '⚠️ ' + e.message;
  } finally {
    sendBtn.disabled = false;
    msgEl.focus();
  }
}

document.getElementById('sendBtn').onclick = send;
msgEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => { msgEl.value = c.textContent; send(); });
</script>
</body>
</html>
